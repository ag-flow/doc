services:
  app:
    image: ghcr.io/ag-flow/doc:latest
    restart: unless-stopped
    env_file: /data/.env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Les templates installés depuis la galerie sont écrits dans /app/templates
      # au runtime : sans volume, chaque redéploiement les efface.
      - templates:/app/templates
      # État runtime du backup (/data DANS le conteneur — rien à voir avec le
      # /data de l'hôte) : repos git locaux, dumps temporaires, known_hosts
      # TOFU. Sans volume : re-clone complet et re-TOFU à chaque redéploiement.
      - appdata:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: docflow
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow -d docflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Collecteur de logs : pousse la sortie stdout des conteneurs de la stack
  # (app, postgres, alloy) vers Loki. Config : deploy/alloy-config.alloy.
  # LOKI_URL / LOKI_HOSTNAME surchargeables via l'environnement ou un .env
  # dans le répertoire de déploiement.
  alloy:
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    environment:
      LOKI_URL: "${LOKI_URL:-http://192.168.10.116:3100/loki/api/v1/push}"
      LOKI_HOSTNAME: "${LOKI_HOSTNAME:-docflow-prod}"
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      # Accès en lecture seule à l'API Docker (logs de tous les conteneurs).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  templates:
  appdata:
  alloy-data:

secrets:
  pg_password:
    file: /data/pg_password.txt
