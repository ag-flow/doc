services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: docflow:latest
    restart: unless-stopped
    env_file: /data/.env
    ports:
      # Stack dev/test : publiée sur le LAN, il n'y a pas de reverse proxy devant.
      # En prod (docker-compose.prod.yml), le port reste bindé sur 127.0.0.1
      # derrière le proxy TLS (DEP-03).
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: docflow
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow -d docflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:

secrets:
  pg_password:
    file: /data/pg_password.txt
